services:
  nginx:
    image: nginx:1.27-alpine
    container_name: blog-nginx
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    # Running nginx does NOT pick up a renewed certificate until it is reloaded.
    # Certbot renews in its own container, so nginx reloads itself: once ~60s
    # after start (to catch the renewal that runs on deploy), then every 30 min.
    # A reload is zero-downtime and a no-op when the certificate is unchanged.
    command:
      - /bin/sh
      - -c
      - |
        ( sleep 60; nginx -s reload; while :; do sleep 1800; nginx -s reload; done ) &
        exec nginx -g 'daemon off;'

  certbot:
    image: certbot/certbot:latest
    container_name: blog-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Renew every 12h using the webroot challenge served by nginx at
    # /.well-known/acme-challenge/. nginx reloads itself (see above), so no
    # --deploy-hook is needed here.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GHCR_OWNER}/blog-frontend:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:3080:80"
    restart: unless-stopped

  backend:
    image: ghcr.io/${GHCR_OWNER}/blog-backend:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  umami:
    image: ghcr.io/${GHCR_OWNER}/blog-umami:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./rds-ca-bundle.pem:/app/rds-ca-bundle.pem:ro
    environment:
      DATABASE_URL: ${UMAMI_DATABASE_URL}
      DATABASE_TYPE: postgresql
    restart: unless-stopped
